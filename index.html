
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カラダログ｜通信テスト</title>
</head>
<body>
  <h2>💧 カラダログ</h2>
  <p id="status">通信テスト準備中…</p>
  <pre id="result"></pre>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxeHd--NdaM-4o1Tmwb1Sy6pUGYcNQWWrMWbzRUcNTkjO91wRIvTgYZDQ-JZBG1sGAfcw/exec";

    async function testConnection() {
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      try {
        status.textContent = "① GASへ通信中…";

        const response = await fetch(GAS_URL, {
          method: "GET",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        status.textContent = "② 通信成功！";
        result.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        status.textContent = "❌ 通信エラー";
        result.textContent = error.message;
      }
    }

    testConnection();
  </script>
</body>
</html>
