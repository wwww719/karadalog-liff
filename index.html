
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>カラダログ｜認証テスト</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h2>💧 カラダログ</h2>
  <p id="status">準備中…</p>
  <p id="detail"></p>

  <script>
    const LIFF_ID = "2011952112-wmxBobwq";

    async function start() {
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");

      try {
        status.textContent = "① LIFF初期化中";

        await Promise.race([
          liff.init({ liffId: LIFF_ID }),
          new Promise((_, reject) =>
            setTimeout(() =>
              reject(new Error("初期化が10秒でタイムアウト")),
              10000
            )
          )
        ]);

        status.textContent = "② LIFF初期化成功";

        if (!liff.isLoggedIn()) {
          detail.textContent =
            "LINEログインが必要です。";
          return;
        }

        status.textContent = "③ LINEログイン確認成功";

        const idToken = liff.getIDToken();

        if (!idToken) {
          detail.textContent =
            "IDトークンを取得できませんでした。";
          return;
        }

        detail.textContent =
          "④ IDトークン取得成功！" +
          " カラダログの認証準備OK！";

      } catch (error) {
        status.textContent =
          "❌ エラー：" + error.message;
      }
    }

    start();
  </script>
</body>
</html>
