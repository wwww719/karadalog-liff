
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>カラダログ｜認証・通信テスト</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h2>💧 カラダログ</h2>
  <p id="status">準備中…</p>
  <p id="detail"></p>

  <script>
    const LIFF_ID = "2011952112-wmxBobwq";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxeHd--NdaM-4o1Tmwb1Sy6pUGYcNQWWrMWbzRUcNTkjO91wRIvTgYZDQ-JZBG1sGAfcw/exec";

    async function start() {
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");

      try {
        status.textContent = "① LIFF初期化中…";
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログインが必要です";
          return;
        }

        status.textContent = "② LINE認証成功";

        const idToken = liff.getIDToken();
        if (!idToken) {
          throw new Error("IDトークンを取得できません");
        }

        detail.textContent = "③ IDトークン取得成功";

        const response = await fetch(GAS_URL, {
          method: "GET"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error("GASの応答が正常ではありません");
        }

        status.textContent = "④ GAS通信成功！";
        detail.textContent =
          "LINE認証・GAS通信ともに正常です！";

      } catch (error) {
        status.textContent = "❌ エラー";
        detail.textContent = error.message;
      }
    }

    start();
  </script>
</body>
</html>
